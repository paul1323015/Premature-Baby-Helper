<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>巴掌小太陽·早產兒照護小幫手</title>
  <!-- Local offline dependencies -->
  <script src="./js/tailwind.min.js"></script>
  <script src="./js/react.production.min.js"></script>
  <script src="./js/react-dom.production.min.js"></script>
  <script src="./js/babel.min.js"></script>
  <script src="./js/chart.min.js"></script>
  <script src="./js/html2pdf.bundle.min.js"></script>
  <script src="./js/chart-scale.js"></script>
  <style>
    /* Custom scrollbar hiding utility */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .header-tools { -ms-overflow-style: none; scrollbar-width: none; max-width: 100%; }
    .header-tools::-webkit-scrollbar { display: none; }
    .ai-chat-panel {
      height: min(42rem, calc(100dvh - 11rem));
      min-height: 30rem;
    }
    .ai-chat-messages {
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
    }
    @media (max-width: 767px) {
      html, body { max-width: 100%; overflow-x: hidden; }
      .header-tools {
        max-width: 100%;
        overflow-x: auto;
        white-space: nowrap;
      }
      .header-tools > button { flex: 0 0 auto; }
    }
    @media (max-width: 640px) {
      .ai-chat-panel {
        height: calc(100dvh - 8rem);
        min-height: 24rem;
      }
    }
    .pdf-section {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .pdf-section h3 {
      break-after: avoid;
      page-break-after: avoid;
    }
    #pdf-report-content table,
    #pdf-report-content tr,
    #pdf-report-content li,
    #pdf-report-content .pdf-item {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    #pdf-report-content .pdf-item {
      display: block !important;
      width: 100%;
      break-inside: avoid-page !important;
      page-break-inside: avoid !important;
      -webkit-column-break-inside: avoid;
    }
    #pdf-report-content .pdf-footer {
      break-inside: avoid;
      page-break-inside: avoid;
      break-before: avoid;
      page-break-before: avoid;
    }
    @media (max-width: 640px) {
      .fixed.inset-0 {
        align-items: flex-start !important;
        overflow-y: auto !important;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom)) !important;
        box-sizing: border-box !important;
      }
      .fixed.inset-0 > div {
        width: 100% !important;
        max-height: calc(100dvh - 2rem) !important;
        overflow-y: auto !important;
        flex-shrink: 0;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>
<body class="bg-amber-50/50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script src="./js/app.bundle.js"></script>

  <script>

    // extension or other worker is intercepting the page.
  </script>

</body>
</html>
