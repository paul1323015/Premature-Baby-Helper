<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巴掌小太陽 - 早產兒照護小幫手</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX interpretation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- html2pdf.js for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* Custom scrollbar hiding utility */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-amber-50/50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // SVG Icon Component for browser offline rendering
    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      const icons = {
        sun: <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" />,
        edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 2 2h14a2 2 0 0 2 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />,
        heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
        calendar: <path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />,
        droplet: <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 15.1 5 17 5 15a7 7 0 0 0 7 7z" />,
        clock: <g><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></g>,
        moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />,
        plus: <path d="M5 12h14m-7-7v14" />,
        check: <path d="M20 6 9 17l-5-5" />,
        x: <g><path d="M18 6 6 18" /><path d="M6 6l12 12" /></g>,
        send: <g><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></g>,
        trendingUp: <g><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></g>,
        eye: <g><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></g>,
        stethoscope: <g><path d="M4.8 2.3A.3.3 0 0 0 4.5 2.6V8A6 6 0 0 0 16.5 8V2.6a.3.3 0 0 0-.3-.3h-1.4a.3.3 0 0 0-.3.3V8a4 4 0 0 1-8 0V2.6a.3.3 0 0 0-.3-.3z" /><path d="M12 14v4a2 2 0 0 0 2 2h2a3 3 0 0 0 3-3V11" /></g>,
        sparkles: <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" />,
        user: <g><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></g>,
        info: <g><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></g>,
        download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></g>,
        alertTriangle: <g><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></g>
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          {...props}
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    };

    const calculateAges = (birthDateStr, dueDateStr) => {
      if (!birthDateStr || !dueDateStr) {
        return {
          chronoText: '資料未設定',
          correctedText: '可點擊「自訂/修改」設定生日與預產期'
        };
      }
      const now = new Date();
      const birth = new Date(birthDateStr);
      const due = new Date(dueDateStr);

      const chronoDays = Math.max(0, Math.floor((now - birth) / (1000 * 60 * 60 * 24)));
      const chronoMonths = Math.floor(chronoDays / 30.4375);
      const chronoDaysRemaining = Math.floor(chronoDays % 30.4375);

      const correctedDays = Math.floor((now - due) / (1000 * 60 * 60 * 24));
      let correctedText = "";

      if (correctedDays < 0) {
        const remainingWeeks = Math.ceil(Math.abs(correctedDays) / 7);
        correctedText = `尚未滿預產期 (差約 ${remainingWeeks} 週)`;
      } else {
        const correctedMonths = Math.floor(correctedDays / 30.4375);
        const correctedDaysRemaining = Math.floor(correctedDays % 30.4375);
        correctedText = `矯正 ${correctedMonths} 個月 ${correctedDaysRemaining} 天`;
      }

      return {
        chronoText: `實際 ${chronoMonths} 個月 ${chronoDaysRemaining} 天`,
        correctedText
      };
    };

    function App() {
      const [isNightMode, setIsNightMode] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [isExporting, setIsExporting] = useState(false);

      const [babyInfo, setBabyInfo] = useState(() => {
        const saved = localStorage.getItem('sun_baby_profile_v4');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          name: '',
          gestationalWeeks: '',
          birthWeight: '',
          birthDate: '',
          dueDate: '',
          currentWeight: '',
          currentHeight: '',
          currentHead: '',
          targetDailyMilk: '',
        };
      });

      // Show edit modal only when user explicitly requests it
      const [showEditProfileModal, setShowEditProfileModal] = useState(false);
      const [editFormData, setEditFormData] = useState({ ...babyInfo });

      useEffect(() => {
        if (babyInfo.name || babyInfo.birthDate) {
          localStorage.setItem('sun_baby_profile_v4', JSON.stringify(babyInfo));
        }
      }, [babyInfo]);

      const handleOpenEditModal = () => {
        setEditFormData({ ...babyInfo });
        setShowEditProfileModal(true);
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        setBabyInfo({ ...editFormData });
        setShowEditProfileModal(false);
      };

      const handleResetData = () => {
        localStorage.removeItem('sun_baby_profile_v4');
        setBabyInfo({
          name: '',
          gestationalWeeks: '',
          birthWeight: '',
          birthDate: '',
          dueDate: '',
          currentWeight: '',
          currentHeight: '',
          currentHead: '',
          targetDailyMilk: '',
        });
        setLogs([]);
        setDoctorNotes([]);
        setEditFormData({
          name: '',
          gestationalWeeks: '',
          birthWeight: '',
          birthDate: '',
          dueDate: '',
          currentWeight: '',
          currentHeight: '',
          currentHead: '',
          targetDailyMilk: '',
        });
      };

      const handleDownloadPDF = () => {
        setIsExporting(true);
        setTimeout(() => {
          const element = document.getElementById('pdf-report-content');
          if (!element) {
            setIsExporting(false);
            return;
          }

          element.style.display = 'block';

          const opt = {
            margin: 10,
            filename: `${babyInfo.name || '寶寶'}_門診照護報告_${new Date().toISOString().slice(0, 10)}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          if (window.html2pdf) {
            window.html2pdf().set(opt).from(element).save().then(() => {
              element.style.display = 'none';
              setIsExporting(false);
            }).catch((err) => {
              console.error(err);
              element.style.display = 'none';
              setIsExporting(false);
            });
          } else {
            window.print();
            element.style.display = 'none';
            setIsExporting(false);
          }
        }, 150);
      };

      const ageData = useMemo(() => {
        return calculateAges(babyInfo.birthDate, babyInfo.dueDate);
      }, [babyInfo.birthDate, babyInfo.dueDate]);

      const [logs, setLogs] = useState([]);
      const [doctorNotes, setDoctorNotes] = useState([]);
      const [newDoctorQuestion, setNewDoctorQuestion] = useState('');

      const [milestones, setMilestones] = useState([
        { id: 1, text: '俯臥（趴著）時能短暫抬起頭部 45 度', done: false },
        { id: 2, text: '眼神能跟隨視線移動或關注黑白卡 10 秒', done: false },
        { id: 3, text: '聽到大人溫柔說話會停止哭泣或發出咕嚕聲', done: false },
        { id: 4, text: '手掌能由緊握逐漸放鬆，雙手偶爾碰觸', done: false },
      ]);

      const [showAddLogModal, setShowAddLogModal] = useState(false);
      const [newLogType, setNewLogType] = useState('feeding');
      const [newLogDetail, setNewLogDetail] = useState('');
      const [newLogAmount, setNewLogAmount] = useState('');

      const [chatMessages, setChatMessages] = useState([
        { sender: 'bot', text: '你好！我是巴掌小太陽的 AI 照護助手 ☀️。你可以詢問我關於早產兒矯正年齡、每日奶量計算、發展里程碑或門診追蹤等問題喔！' }
      ]);
      const [inputMessage, setInputMessage] = useState('');

      const todayTotalMilk = useMemo(() => {
        return logs
          .filter(l => l.type === 'feeding' && l.amount)
          .reduce((sum, l) => sum + parseInt(l.amount || '0', 10), 0);
      }, [logs]);

      const targetMilkNum = parseInt(babyInfo.targetDailyMilk || '0', 10);
      const milkPercent = targetMilkNum > 0 ? Math.min(100, Math.round((todayTotalMilk / targetMilkNum) * 100)) : 0;

      const handleAddLog = (e) => {
        e.preventDefault();
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const newEntry = {
          id: Date.now(),
          type: newLogType,
          time: timeStr,
          detail: newLogDetail || (newLogType === 'feeding' ? '瓶餵母乳' : '濕尿布'),
          amount: newLogType === 'feeding' && newLogAmount ? `${newLogAmount}ml` : null,
        };

        setLogs([newEntry, ...logs]);
        setShowAddLogModal(false);
        setNewLogDetail('');
        setNewLogAmount('');
      };

      const handleAddDoctorNote = (e) => {
        e.preventDefault();
        if (!newDoctorQuestion.trim()) return;
        setDoctorNotes([
          ...doctorNotes,
          { id: Date.now(), question: newDoctorQuestion, answered: false, tag: '診間提問' }
        ]);
        setNewDoctorQuestion('');
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMessage.trim()) return;

        const userText = inputMessage;
        setChatMessages(prev => [...prev, { sender: 'user', text: userText }]);
        setInputMessage('');

        setTimeout(() => {
          let replyText = "早產兒請務必根據【矯正年齡】來對照生長與發展指標！每日體重增加建議約為 20~30 公克。特別提醒：AI 建議僅供參考，如有疑慮請及時諮詢兒科或新生兒科醫師。";
          const babyName = babyInfo.name || '寶寶';
          if (userText.includes('矯正') || userText.includes('算') || userText.includes('週')) {
            replyText = `${babyName} 評估抬頭、抓握或體重增長時，請以預產期計算的【矯正年齡】（${ageData.correctedText}）為準喔！`;
          } else if (userText.includes('奶量') || userText.includes('喝')) {
            const weight = parseFloat(babyInfo.currentWeight || '0');
            if (weight > 0) {
              const minMilk = Math.round(weight * 150);
              const maxMilk = Math.round(weight * 180);
              replyText = `早產兒每日建議總奶量公式為：體重(kg) × 150ml ~ 180ml。以 ${babyName} 目前體重 ${weight}kg 計算，一天建議總奶量約為 ${minMilk}ml ~ ${maxMilk}ml。`;
            } else {
              replyText = `早產兒每日建議總奶量公式為：體重(kg) × 150ml ~ 180ml。您可以先點擊「自訂/修改」填入寶寶體重來計算喔！`;
            }
          } else if (userText.includes('眼') || userText.includes('視網膜') || userText.includes('ROP')) {
            replyText = "早產兒視網膜病變（ROP）是極低出生體重寶寶需要密切追蹤的項目，請遵照新生兒科或眼科醫師排定的門診時間定期檢查喔！";
          }
          setChatMessages(prev => [...prev, { sender: 'bot', text: replyText }]);
        }, 600);
      };

      const themeBg = isNightMode ? 'bg-slate-900 text-slate-100' : 'bg-amber-50/50 text-slate-800';
      const cardBg = isNightMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-amber-100';

      return (
        <div className={`min-h-screen font-sans ${themeBg} transition-colors duration-200`}>
          {}
          <header className={`sticky top-0 z-30 border-b ${isNightMode ? 'bg-slate-900 border-slate-800' : 'bg-amber-500 text-white border-amber-600'}`}>
            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <div className="p-2 bg-yellow-400 text-amber-900 rounded-full shadow-md">
                  <Icon name="sun" className="w-5 h-5 fill-current" />
                </div>
                <div>
                  <h1 className="font-bold text-base flex items-center gap-2">巴掌小太陽</h1>
                  <p className="text-[11px] opacity-90">掌心裡的微光，照亮健康的每一步</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={handleDownloadPDF}
                  disabled={isExporting}
                  className="px-2.5 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition-colors flex items-center gap-1 shadow-sm disabled:opacity-50"
                  title="匯出 PDF 照護與門診報告"
                >
                  <Icon name="download" className="w-4 h-4" />
                  <span>{isExporting ? '匯出中...' : '匯出 PDF'}</span>
                </button>
                <button
                  onClick={() => setShowHelpModal(true)}
                  className="px-2.5 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition-colors flex items-center gap-1 shadow-sm"
                  title="開啟使用說明"
                >
                  <Icon name="info" className="w-4 h-4" />
                  <span>使用說明</span>
                </button>
                <button
                  onClick={() => setIsNightMode(!isNightMode)}
                  className="p-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white transition-colors"
                  title="切換夜間柔光模式"
                >
                  <Icon name="moon" className="w-5 h-5" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-2xl mx-auto px-4 pt-4 pb-16">
            {/* Soft prompt banner if baby info is completely empty */}
            {!babyInfo.name && !babyInfo.birthDate && (
              <div className="mb-4 p-3 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-400 text-white shadow-sm flex items-center justify-between">
                <div className="flex items-center gap-2 text-xs">
                  <span className="text-lg">☀️</span>
                  <div>
                    <span className="font-bold block">歡迎進入巴掌小太陽！</span>
                    <span className="opacity-95 text-[11px]">可隨時點擊「自訂/修改」填入資料以計算矯正年齡。</span>
                  </div>
                </div>
                <button
                  onClick={handleOpenEditModal}
                  className="px-3 py-1 bg-white text-amber-700 rounded-xl text-xs font-bold shadow hover:bg-amber-50 transition-colors whitespace-nowrap ml-2"
                >
                  填寫資料
                </button>
              </div>
            )}

            {}
            <div className={`p-4 rounded-2xl border shadow-sm mb-4 ${cardBg}`}>
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-12 h-12 rounded-full bg-amber-200 border-2 border-amber-400 flex items-center justify-center text-2xl shadow-inner">
                    👶
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h2 className="text-lg font-bold">
                        {babyInfo.name ? `${babyInfo.name} 寶寶` : '小太陽寶寶'}
                      </h2>
                      <button
                        onClick={handleOpenEditModal}
                        className="px-2 py-0.5 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs flex items-center gap-1 font-semibold transition-colors"
                        title="點擊自訂名字與數據"
                      >
                        <Icon name="edit" className="w-3 h-3" />
                        <span>自訂/修改</span>
                      </button>
                    </div>
                    <div className="text-xs font-bold text-amber-600 mt-0.5">{ageData.correctedText}</div>
                    <div className="text-[11px] text-slate-400">
                      {ageData.chronoText} {babyInfo.gestationalWeeks ? `(${babyInfo.gestationalWeeks}週出生 / ${babyInfo.birthWeight || '—'}g)` : ''}
                    </div>
                  </div>
                </div>
                <div className="text-right">
                  <div className="text-[11px] text-slate-400">當前體重</div>
                  <div className="text-xl font-black text-amber-600">
                    {babyInfo.currentWeight ? `${babyInfo.currentWeight} kg` : '— kg'}
                  </div>
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex space-x-2 overflow-x-auto pb-2 mb-4 no-scrollbar">
              {[
                { id: 'dashboard', label: '☀️ 今日快照' },
                { id: 'growth', label: '📈 生長與發展' },
                { id: 'care', label: '🍼 照護日誌' },
                { id: 'doctor', label: '🏥 看診備忘' },
                { id: 'chat', label: '🤖 AI 諮詢' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                    activeTab === tab.id
                      ? 'bg-amber-500 text-white shadow-md'
                      : 'bg-white border text-slate-600 hover:bg-amber-50'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {}
            {/* Dashboard View */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className={`p-4 rounded-2xl border ${cardBg}`}>
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-bold text-sm flex items-center gap-1.5">
                      <Icon name="droplet" className="text-amber-500 w-4 h-4" />
                      今日總奶量進度
                    </span>
                    <span className="text-base font-bold text-amber-600">
                      {todayTotalMilk} / {babyInfo.targetDailyMilk || '0'} ml
                    </span>
                  </div>
                  <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                    <div className="h-full bg-amber-400 rounded-full transition-all duration-500" style={{ width: `${milkPercent}%` }}></div>
                  </div>
                  <p className="text-[11px] text-slate-400 mt-2 text-right">
                    {targetMilkNum > 0 ? `已達成每日目標的 ${milkPercent}%` : '未設定每日目標奶量 (可由「自訂/修改」設定)'}
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button
                    onClick={() => { setNewLogType('feeding'); setShowAddLogModal(true); }}
                    className="p-4 rounded-2xl border bg-amber-50 border-amber-200 text-amber-900 font-bold text-sm flex items-center justify-center gap-2 hover:bg-amber-100 transition-colors shadow-sm"
                  >
                    🍼 記餵奶
                  </button>
                  <button
                    onClick={() => { setNewLogType('diaper'); setShowAddLogModal(true); }}
                    className="p-4 rounded-2xl border bg-blue-50 border-blue-200 text-blue-900 font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-100 transition-colors shadow-sm"
                  >
                    👶 記尿布
                  </button>
                </div>

                <div className={`p-4 rounded-2xl border ${cardBg}`}>
                  <h3 className="font-bold text-sm mb-2 flex items-center gap-1.5 text-amber-600">
                    💡 今日早產兒照護溫馨叮嚀
                  </h3>
                  <p className="text-xs text-slate-600 leading-relaxed">
                    早產寶寶體溫調節機能尚未成熟，室溫建議保持在 24~26°C。進行袋鼠護理（Kangaroo Care）肌膚接觸時，請注意保暖與寶寶的呼吸頻率喔！
                  </p>
                </div>
              </div>
            )}

            {/* Growth View */}
            {activeTab === 'growth' && (
              <div className={`p-4 rounded-2xl border space-y-4 ${cardBg}`}>
                <h3 className="font-bold text-base flex items-center gap-2">
                  <Icon name="trendingUp" className="text-amber-500" />

                      <th className="p-1.5">內容</th>
                      <th className="p-1.5">份量</th>
                    </tr>
                  </thead>
                  <tbody>
                    {logs.map((log) => (
                      <tr key={log.id} className="border-b">
                        <td className="p-1.5 font-bold text-amber-700">{log.time}</td>
                        <td className="p-1.5">{log.detail}</td>
                        <td className="p-1.5">{log.amount || '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>

            {/* Development Milestones */}
            <div className="mb-6">
              <h2 className="text-sm font-bold text-slate-800 mb-2 border-b pb-1">🎯 發展里程碑完成狀況</h2>
              <div className="grid grid-cols-2 gap-2 text-xs">
                {milestones.map((m) => (
                  <div key={m.id} className="p-2 border rounded-lg flex items-center gap-2">
                    <span>{m.done ? '✅' : '⏳'}</span>
                    <span className={m.done ? 'font-medium text-slate-800' : 'text-slate-500'}>{m.text}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="mt-8 pt-4 border-t text-center text-[10px] text-slate-400">
              巴掌小太陽 - 早產兒照護小幫手 ☀️ | 本報告為家長自主紀錄，看診時可提供給醫師參考
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
